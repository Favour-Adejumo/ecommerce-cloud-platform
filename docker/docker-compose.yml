services:
  postgres_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_persistent_data:/var/lib/postgresql/data
    networks:
      - backend_network
    restart: unless-stopped

  flask_app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5000:5000"
    networks:
      - backend_network
    depends_on:
      - postgres_db
    restart: unless-stopped

volumes:
  pg_persistent_data:

networks:
  backend_network:
    name: flask_db_isolated_network
